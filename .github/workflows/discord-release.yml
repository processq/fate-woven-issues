name: Post release notes to Discord

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post to the Discord changelog channel (split into several messages if long)
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_CHANGELOG_WEBHOOK secret set; nothing posted."; exit 0; fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            NAME=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].name')
            BODY=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].body')
            TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name')
          fi
          export TITLE="${NAME:-$TAG}"
          python3 - <<'PY'
          import json, os, time, urllib.request
          title = os.environ["TITLE"]
          lines = ("**%s**\n%s" % (title, os.environ.get("BODY", ""))).split("\n")
          LIMIT = 1900
          chunks, cur = [], ""
          for line in lines:
              while len(line) > LIMIT:
                  if cur:
                      chunks.append(cur); cur = ""
                  chunks.append(line[:LIMIT]); line = line[LIMIT:]
              if len(cur) + len(line) + 1 > LIMIT and cur:
                  chunks.append(cur); cur = ""
              cur = cur + line + "\n"
          if cur.strip():
              chunks.append(cur)
          chunks = chunks[:12]
          for i, c in enumerate(chunks):
              if i:
                  c = "(continued) " + c
              req = urllib.request.Request(os.environ["WEBHOOK"], data=json.dumps({"content": c.rstrip(), "allowed_mentions": {"parse": []}}).encode(), headers={"Content-Type": "application/json", "User-Agent": "fate-woven-release-bot"})
              urllib.request.urlopen(req, timeout=30)
              time.sleep(1.5)
          print("posted", len(chunks), "message(s)")
          PY
