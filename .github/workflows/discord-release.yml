name: Post release notes to Discord

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post a summary of the release notes to the Discord changelog channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_CHANGELOG_WEBHOOK secret set; nothing posted."; exit 0; fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            NAME=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].name')
            BODY=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].body')
            TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name')
            URL=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].html_url')
          fi
          export TITLE="${NAME:-$TAG}"
          export URL
          python3 - <<'PY'
          import json, os, urllib.request
          title = os.environ["TITLE"]
          body = os.environ.get("BODY", "").replace("\r\n", "\n")
          url = os.environ.get("URL", "")
          LIMIT = 1900
          link = ("\nFull release notes: " + url) if url else ""
          marker = "## Full list"
          short = body.split(marker)[0].rstrip() if marker in body else body
          head = "**%s**\n" % title
          if len(head + short + link) <= LIMIT:
              text = head + short + (link if (marker in body or len(head + body) > LIMIT) else "")
          else:
              room = LIMIT - len(head) - len(link) - 10
              cut = short[:room]
              cut = cut[:cut.rfind("\n")] if "\n" in cut else cut
              text = head + cut + "\n..." + link
          req = urllib.request.Request(os.environ["WEBHOOK"], data=json.dumps({"content": text, "allowed_mentions": {"parse": []}}).encode(), headers={"Content-Type": "application/json", "User-Agent": "fate-woven-release-bot"})
          urllib.request.urlopen(req, timeout=30)
          print("posted", len(text), "characters")
          PY
